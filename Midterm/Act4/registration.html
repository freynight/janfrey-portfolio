<form>
    <h2>Student Registration Form</h2><br>
    <label>Student Name</label><br>
    <input type="Name" placeholder="Enter Name" required><br>
    <label>Email</label><br>
    <input type="Email" placeholder="Enter Email" required><br>
    <label>Password</label><br>
    <input type="Password" placeholder="Enter Password" required><br>
    <label>Gender</label><br>
    <input type="radio" name="Gender" value="male" required> Male
    <input type="radio" name="Gender" value="female" required> Female<br>
    <label>Course</label><br>
    <select name="dropdown">
        <option value="BSIT" selected>BSIT</option>
        <option value="BSIT" selected>BSCS</option>
        <option value="BSIT" selected>BSTM</option>
        <option value="BSIT" selected>BSHM</option>
        </select><br>
    <label>Skills</label><br>
    <input type="checkbox" name="HTML" value="on" required> HTML
    <input type="checkbox" name="CSS" value="on" required> CSS
    <input type="checkbox" name="JAVA" value="on" required> JAVASCRIPT
    <br>
    <label>Profile Picture</label><br>
    <input type="file" name="fileupload" accept="image*" required/>
    <label>Address</label><br>
    <textarea rows="5" cols="50" name="Description" placeholder="here...."></textarea><br>
    <button type="submit">Submit</button>
    <button type="cancel">Cancel</button>
</form>
</body>
</html>
