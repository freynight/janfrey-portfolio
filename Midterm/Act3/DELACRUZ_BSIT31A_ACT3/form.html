<body style="margin: 0;">

<header style="background-color: beige; padding: 20px; text-align: center;">

    <p>Apply Student Form</p>

<nav style="background-color: aquamarine; display: flex; justify-content: center; gap: 100px; padding: 10px;">

    <a href="form.html">Registration Form</a>

<form>
Student Name: <br><input type="text" name="student_name" />
<br></br>
Student Number: <br><input type="text" name="student_number" />
<br></br>
Email: <br><input type="text" name="email" />
<br></br>
Gender
<br>
<input type="radio" name="gender" value="male"> Male
<input type="radio" name="gender" value="female"> Female
<br></br>
Course
<br>
<select name="dropdown">
    <option value="bsit" selected>BSIT</option>
    <option value="bscs" selected>BSCS</option>
    <option value="bstm" selected>BSTM</option>
    <option value="bshm" selected>BSHM</option>
    </select>
<br></br>

Skills<br>
    <input type="checkbox" name="html" value="on"> HTML
    <input type="checkbox" name="css" value="on"> CSS
    <input type="checkbox" name="java_script" value="on"> JAVA SCRIPT
<br></br>

<Address>
    Description: <br />
<textarea rows="5" cols="50" name="description" placeholder=" Enter description here... "></textarea>
</Address>
<br></br>


<input type="submit" name="submit" value="Submit" />
<input type="reset" name="reset"  value="Reset" />
<input type="image" name="imagebutton" src="/html/images/logo.png" />

</form>
